# dept_promo_storyboard_60s.xlsx 기반 60초 콘티 (LTX-2.5). s10(로고·슬로건)은 편집 단계라 생성 제외.
# 사진이 없는 I2V/제어 장면은 T2V 임시본으로 대체(사진이 들어오면 workflow를 ltx25_i2v로 바꾸고 image를 지정).
# 부정 프롬프트는 CFG=1이라 효과가 없어 비워 둔다.

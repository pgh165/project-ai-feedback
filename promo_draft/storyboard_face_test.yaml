# 본인 사진 I2V 시험. 사진 비율(3:4)에 맞춰 잘림 없이 생성. 부정 프롬프트는 CFG=1이라 효과가 없어 비워 둔다.
project: face-test
defaults:
  workflow: ltx25_i2v
  width: 960
  height: 1280
  frames: 121
  fps: 24
  seed: 500
  negative_prompt: ""
shots:
  - id: f01
    image: assets/photos/face/portrait.jpg
    prompt: "Use the provided image as the first frame. A young Korean man with a thick black bowl-cut hairstyle and thin round metal glasses, wearing a black crew-neck t-shirt, faces the camera against a plain gray studio background. He blinks naturally, then slowly breaks into a gentle closed-mouth smile and gives one small nod. His face, glasses, hair and clothing stay exactly as shown. Soft, even studio lighting. Locked-off static camera."
